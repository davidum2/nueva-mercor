schema_version = "1.1"
artifacts = ["/logs/artifacts/candidate.bundle", "/logs/artifacts/capture.log"]

[task]
name = "mercor/alvisnlp-max-weight-disjoint-annotation-selector"
description = ""
keywords = []

[metadata]
ext_id              = "4f83e06f549746a880f64d1f6e5a1885"
task_id             = "alvisnlp-max-weight-disjoint-annotation-selector"
display_title       = "Optimal Max-Weight Non-Overlapping Annotation Selection"
display_description = "Add optimal maximum-weight non-overlapping annotation selection to AlvisNLP core and expression language."
original_title      = "alvisnlp-max-weight-disjoint-annotation-selector"
category            = "feature_request"
language            = "java"
repository_url       = "https://github.com/Bibliome/alvisnlp"
base_commit_hash    = "953e5bbfa64c964ee00a7bd3fc88911a734a2018"

[verifier]
environment_mode = "separate"
timeout_sec      = 1600.0

[verifier.env]

[agent]
timeout_sec = 5400.0

[environment]
build_timeout_sec = 1600.0
workdir      = "/app"
os           = "linux"
cpus         = 2
memory_mb    = 8192
storage_mb   = 20480
gpus         = 0
allow_internet = false
mcp_servers  = []

[environment.env]
[solution.env]

[[verifier.collect]]
command = '''#!/bin/sh
# Package the final repository state (commits and working tree) as a git bundle for grading.
WD="/app"
OUT=/logs/artifacts
B="$OUT/candidate.bundle"
TB="$OUT/.candidate.bundle.tmp"
mkdir -p "$OUT"
rm -rf -- "$B" "$TB" "$OUT/capture.log"
LOG="$OUT/capture.log"
t() { date -u +%H:%M:%S; }
fail() { rm -rf -- "$B" "$TB"; echo "$(t) capture: FAIL: $*" >> "$LOG"; exit 0; }
echo "$(t) capture: start wd=$WD user=$(id -u)" > "$LOG"
cd "$WD" 2>/dev/null || fail "no workdir $WD"
export GIT_AUTHOR_NAME=verifier GIT_AUTHOR_EMAIL=verifier@local GIT_COMMITTER_NAME=verifier GIT_COMMITTER_EMAIL=verifier@local
g() { git -c safe.directory='*' "$@"; }
echo "$(t) head=$(g rev-parse HEAD 2>&1)" >> "$LOG"
g add -A >> "$LOG" 2>&1 || fail "git add -A failed"
echo "$(t) staged" >> "$LOG"
g diff --cached --name-only --diff-filter=A 2>/dev/null | while IFS= read -r f; do
  if [ -f "$f" ] && [ "$(wc -c < "$f" 2>/dev/null || echo 0)" -gt 20000000 ]; then
    g rm --cached -q -- "$f" >/dev/null 2>&1 && echo "skipped large new file: $f" >> "$LOG"
  fi
done
TREE=$(g write-tree 2>> "$LOG") || fail "write-tree failed"
PARENT=$(g rev-parse --verify -q HEAD)
if [ -n "$PARENT" ]; then C=$(g commit-tree "$TREE" -p "$PARENT" -m final 2>> "$LOG") || fail "commit-tree failed"
else C=$(g commit-tree "$TREE" -m final 2>> "$LOG") || fail "commit-tree failed"; fi
g update-ref refs/submission/final "$C" >> "$LOG" 2>&1 || fail "update-ref failed"
echo "$(t) committed $C" >> "$LOG"
g bundle create "$TB" refs/submission/final --since="12 hours ago" >> "$LOG" 2>&1 \
  || g bundle create "$TB" refs/submission/final -1 >> "$LOG" 2>&1 \
  || fail "bundle create failed"
[ -s "$TB" ] || fail "empty bundle"
mv -f -- "$TB" "$B" || fail "moving bundle into place failed"
echo "$(t) capture: done final=$C bytes=$(wc -c < "$B" 2>/dev/null)" >> "$LOG"
exit 0
'''
user = "root"
timeout_sec = 600.0
